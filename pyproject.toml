[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Seeded maze generation library"
requires-python = ">= 3.10"
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
exclude_gitignore = true
